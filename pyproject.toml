[project]
name = "sv-vi"
version = "0.1.0"
description = "確率的ボラティリティモデルの変分推論（社内論文用の実験コード）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=9.0.0",
    "arviz>=1.3.0",
    "jax>=0.12.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "numpyro>=0.22.0",
    "optax>=0.2.9",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sv_vi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "E501"]  # 行長は ruff format に任せる（日本語・TeX 文字列は折り返さない）

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
# frozen dataclass の既定値は不変なので、引数の既定値に使ってよい
extend-immutable-calls = ["sv_vi.logdensity.ModelSpec", "sv_vi.advi.ADVIConfig"]
